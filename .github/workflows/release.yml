name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches Cargo.toml version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Cargo.toml version $v does not match tag ${{ github.ref_name }}" }

      - name: Build
        run: cargo build --release --locked

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "target/release/fingerprint-disabler.exe"
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + "  fingerprint-disabler.exe" | Out-File -Encoding ascii fingerprint-disabler.exe.sha256
          gh release create "${{ github.ref_name }}" $exe fingerprint-disabler.exe.sha256 --title "${{ github.ref_name }}" --generate-notes
